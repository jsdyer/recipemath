name: RecipeMath · Check, refresh and publish
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 12 1 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recipemath-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Refresh the official CNF release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/refresh.py
      - name: Test recipe calculations and complete catalogue
        run: node --test tests/*.test.mjs
      - name: Test collector and offline builder
        run: python3 -m unittest discover -s tests -v
      - name: Build static application
        run: python3 scripts/build.py
      - name: Install browser test client
        run: python3 -m pip install -r tests/browser-requirements.txt
      - name: Exercise application with runner Google Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: python3 tests/browser_smoke.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-checks
          path: browser-checks/
          retention-days: 7
      - name: Save validated source snapshot
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated CNF 2026 source snapshot'
            git push
          fi
      - name: Save reviewable site
        uses: actions/upload-artifact@v7
        with:
          name: recipemath-preview
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - name: Package Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: publish
